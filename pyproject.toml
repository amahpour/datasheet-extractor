[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasheet-extractor"
version = "0.1.0"
description = "Local datasheet PDF extraction pipeline using Docling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling",
    "ollama",
    "pandas",
    "pydantic>=2.0",
    "pillow",
]

[project.scripts]
datasheet-extract = "cli.ds_extract:main"
datasheet-smoke-test = "cli.smoke_test:main"

[dependency-groups]
dev = [
    "pytest",
    "ipykernel>=7.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cli", "src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
